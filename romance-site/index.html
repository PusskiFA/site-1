<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Әлихан ❤️ Анёка</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1023;color:#fff;font-family:Georgia,serif;overflow:hidden}main{height:100dvh;position:relative;display:grid;place-items:center;text-align:center;isolation:isolate;background:radial-gradient(ellipse at 50% 65%,#493552,#10152c 75%);transition:background 2s}.stars,.particles{position:absolute;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;animation:twinkle 2s infinite alternate}.particle{position:absolute;animation:fall linear infinite;font-size:18px;opacity:.7}.city{position:absolute;bottom:0;width:100%;height:27%;background:repeating-linear-gradient(90deg,#101326 0 32px,#171c33 32px 64px,#0e1529 64px 100px);clip-path:polygon(0 36%,8% 36%,8% 0,16% 0,16% 50%,24% 50%,24% 20%,34% 20%,34% 60%,42% 60%,42% 8%,49% 8%,49% 45%,58% 45%,58% 25%,67% 25%,67% 50%,77% 50%,77% 0,84% 0,84% 40%,93% 40%,93% 15%,100% 15%,100% 100%,0 100%);opacity:.7}.glow{position:absolute;bottom:-25%;height:65%;width:90%;background:radial-gradient(ellipse,#e9a7a944,transparent 70%);filter:blur(30px)}.content{z-index:2;padding:28px;max-width:750px;animation:rise 1.5s both}h1{font-size:clamp(40px,9vw,85px);font-weight:400;margin:12px 0;letter-spacing:1px;text-shadow:0 4px 40px #e9a1b877}p{font-size:clamp(17px,3.4vw,25px);line-height:1.6;color:#f6dfe7}small{letter-spacing:4px;text-transform:uppercase;color:#f4becd}button{background:linear-gradient(120deg,#f4c2d3,#f6e1c6);color:#352034;border:0;border-radius:50px;padding:17px 34px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 8px 50px #d78ea155}.controls{position:absolute;bottom:28px;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:15px;align-items:center}.controls button{padding:12px 22px}.progress{position:absolute;bottom:0;height:3px;background:#f7c7d8;left:0;width:0;z-index:9}.couple{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);font-size:75px;filter:drop-shadow(0 10px 25px #e6acc8aa);animation:sway 5s ease-in-out infinite;opacity:.6}.hidden{display:none}@keyframes twinkle{to{opacity:.2;transform:scale(.5)}}@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes sway{50%{transform:translateX(-50%) rotate(5deg)}}@media(max-width:500px){.couple{font-size:54px;bottom:22%}}
</style></head><body><main id="stage"><div class="stars" id="stars"></div><div class="particles" id="particles"></div><div class="glow"></div><div class="city"></div><div class="couple">💑</div><div class="content"><small id="chapter">Біздің тарихымыз</small><h1 id="title">Әлихан ❤️ Анёка</h1><p id="subtitle">Бәрі бір вальстен басталды...</p><button id="start">Біздің тарихты бастау ▶</button><p id="error" style="font:14px system-ui;color:#ffc9d0"></p></div><div class="controls hidden" id="controls"><button id="toggle">⏸ Тоқтату</button><span id="clock">0:00</span></div><div class="progress" id="progress"></div><audio id="audio" preload="metadata" src="./narration.mp3"></audio></main>
<script>
const audio=document.getElementById('audio'),stage=document.getElementById('stage'),title=document.getElementById('title'),sub=document.getElementById('subtitle'),chapter=document.getElementById('chapter'),start=document.getElementById('start'),toggle=document.getElementById('toggle'),controls=document.getElementById('controls'),error=document.getElementById('error'),progress=document.getElementById('progress'),clock=document.getElementById('clock'),particles=document.getElementById('particles');
const scenes=[
[0,'Біздің тарихымыз','Әлихан ❤️ Анёка','Кейде ең әдемі оқиға күтпеген жерден басталады...','#38213f','✨'],
[15,'Мектеп','Бір ғана сұрақ','«Әлихан, менімен вальс билейсің бе?»','#3b304a','🌸'],
[37,'Алғашқы дайындық','Бірге билеген күндер','Кездесулер, күлкі және алғашқы сезімдер...','#3e2853','🌷'],
[63,'Соңғы қоңырау','Біздің вальс','Ұмытылмас мектеп кеші','#433054','💗'],
[86,'Жаңа өмір','Бірге Астанаға','Жаңа қала. Жаңа арман. Бірге.','#192e51','✨'],
[108,'Естеліктер','Астанадағы күндер','Кафелер, серуендер және ұзақ әңгімелер...','#273b4b','💖'],
[131,'Көктем','Гүлдеген сезімдер','Әр күн — жаңа естелік','#3d4b3d','🌸'],
[145,'Жаз','Жылы кештер','Қол ұстасып жүрген сәттер','#5a3c45','✨'],
[158,'Күз','Алтын жапырақтар','Уақыт өтсе де, естеліктер қалады','#513a2f','🍁'],
[174,'Қысқы Астана','Әлихан ❤️ Анёка','Бәрі бір вальстен басталды...','#14233d','❄️']];
for(let i=0;i<80;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*90+'%';s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').append(s)}
let current=-1;
function render(){let t=audio.currentTime;let idx=0;for(let i=0;i<scenes.length;i++)if(t>=scenes[i][0])idx=i;if(idx!==current){current=idx;let s=scenes[idx];chapter.textContent=s[1];title.textContent=s[2];sub.textContent=s[3];stage.style.background='radial-gradient(ellipse at 50% 65%,'+s[4]+',#0b1023 85%)';particles.replaceChildren();for(let j=0;j<24;j++){let p=document.createElement('span');p.className='particle';p.textContent=s[5];p.style.left=Math.random()*100+'%';p.style.top='-10%';p.style.animationDuration=(5+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*12)+'s';particles.append(p)}}progress.style.width=(audio.duration?100*t/audio.duration:0)+'%';clock.textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
async function play(){error.textContent='';try{await audio.play();start.classList.add('hidden');controls.classList.remove('hidden');toggle.textContent='⏸ Тоқтату'}catch(e){error.textContent='Аудио іске қосылмады. narration.mp3 файлы осы папкада бар екенін тексеріңіз.';toggle.textContent='▶ Жалғастыру'}}
start.onclick=play;toggle.onclick=()=>{if(audio.paused)play();else audio.pause()};audio.onpause=()=>toggle.textContent='▶ Жалғастыру';audio.onplay=()=>toggle.textContent='⏸ Тоқтату';audio.ontimeupdate=render;audio.onended=()=>{toggle.textContent='↻ Қайта бастау';title.textContent='Әлихан ❤️ Анёка';sub.textContent='Бәрі бір вальстен басталды...'};audio.onerror=()=>error.textContent='Аудиофайл табылмады: narration.mp3';render();
</script></body></html>
